name: Update nodes and deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Every 30 minutes, offset from the busy start of the hour. UTC.
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: node-helper-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test parser and recovery
        run: python -m unittest discover -s tests -v
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore previous snapshot
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: site/data.json
          key: node-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: node-snapshot-v1-
      - name: Fetch both sources
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/fetch_nodes.py --previous-url "${PAGES_BASE_URL%/}/data.json"
      - name: Save latest snapshot
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: site/data.json
          key: node-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Write detection summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('site/data.json').read_text())
          lines = ['## 节点检测结果', '', '检测时间：' + data['checked_at'], '']
          for source in data['sources']:
              lines.append('- ' + source['name'] + ': ' + source['status'] + ('（保留上次成功数据）' if source['stale'] else ''))
          lines += ['', data['latest']['reason']]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('\n'.join(lines) + '\n')
          if all(s['status'] == 'error' for s in data['sources']):
              print('::warning::Both sources failed. The deployed page will show failure status and any last successful data.')
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
